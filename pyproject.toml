[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse"
version = "0.1.0"
description = "A stream processor with event-time windows and exactly-once recovery, built from scratch."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["streampulse*"]
